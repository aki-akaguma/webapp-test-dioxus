<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dioxusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dioxus-style Hexagon -->
  <path d="M64 8 L112 36 V92 L64 120 L16 92 V36 Z" fill="url(#dioxusGrad)" />
  
  <!-- White Inner Hexagon/Frame -->
  <path d="M64 15 L105 39 V89 L64 113 L23 89 V39 Z" fill="#FFFFFF" opacity="0.2" />

  <!-- Cute Mascot Body (Rounded Rect as Path) -->
  <path d="M51,45 h 26 a 12,12 0 0 1 12,12 v 16 a 12,12 0 0 1 -12,12 h -26 a 12,12 0 0 1 -12,-12 v -16 a 12,12 0 0 1 12,-12 z" fill="#FFFFFF" />
  
  <!-- Eyes (Circles as Paths) -->
  <path d="M 52,56 a 4,4 0 1,0 0,8 a 4,4 0 1,0 0,-8 z" fill="#1a3a5f" />
  <path d="M 76,56 a 4,4 0 1,0 0,8 a 4,4 0 1,0 0,-8 z" fill="#1a3a5f" />
  
  <!-- Smile -->
  <path d="M58 70 Q64 75 70 70" stroke="#1a3a5f" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Dioxus Badge (Circle as Path) -->
  <path d="M 85,70 a 15,15 0 1,0 0,30 a 15,15 0 1,0 0,-30 z" fill="#00d2ff" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- The "T" (Text as Path) -->
  <path d="M 78,81 h 14 v 3 h -14 z M 83.5,84 h 3 v 11 h -3 z" fill="#FFFFFF" />
  
  <!-- Antennas (Lines as Paths) -->
  <path d="M 50,45 L 45,35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <path d="M 78,45 L 83,35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  
  <!-- Antenna Nodes (Circles as Paths) -->
  <path d="M 45,31 a 4,4 0 1,0 0,8 a 4,4 0 1,0 0,-8 z" fill="#00d2ff" stroke="#FFFFFF" stroke-width="1.5" />
  <path d="M 83,31 a 4,4 0 1,0 0,8 a 4,4 0 1,0 0,-8 z" fill="#00d2ff" stroke="#FFFFFF" stroke-width="1.5" />
  
  <!-- Feet (Rounded Rects as Paths) -->
  <path d="M 48,85 h 6 a 3,3 0 0 1 3,3 a 3,3 0 0 1 -3,3 h -6 a 3,3 0 0 1 -3,-3 a 3,3 0 0 1 3,-3 z" fill="#FFFFFF" />
  <path d="M 74,85 h 6 a 3,3 0 0 1 3,3 a 3,3 0 0 1 -3,3 h -6 a 3,3 0 0 1 -3,-3 a 3,3 0 0 1 3,-3 z" fill="#FFFFFF" />
</svg>
